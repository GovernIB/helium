# Plugin d'IntelliJ per editar els BPMN de Helium amb el mateix editor visual que Helium.
# IntelliJ fa servir la versió per saber si hi ha una actualització: s'ha d'augmentar a cada versió que es distribueix
# (./gradlew distribuir), i no pot ser SNAPSHOT.
pluginVersion = 4.0.4

# Repositori de plugins propi: URL on es publica el contingut de dist/ (updatePlugins.xml i el ZIP). Els
# desenvolupadors afegeixen <pluginRepositoryUrl>/updatePlugins.xml a IntelliJ (Manage Plugin Repositories).
pluginRepositoryUrl = https://raw.githubusercontent.com/GovernIB/helium/helium-4.0/helium-intellij-plugin/dist

# Primera versió de la plataforma suportada (2026.3). Per suportar-ne d'anteriors, cal compilar contra la més antiga
# (platformVersion) i comprovar-ho amb verifyPlugin.
pluginSinceBuild = 263

# IDE contra el qual es compila i amb el qual s'executa runIde. Per no descarregar-lo, es pot indicar un IntelliJ
# instal·lat amb -PplatformLocalPath=/ruta/a/intellij (o al gradle.properties de l'usuari, ~/.gradle).
platformType = IU
platformVersion = 2026.3

org.gradle.jvmargs = -Xmx2g
kotlin.stdlib.default.dependency = false
